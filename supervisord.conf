[unix_http_server]
file=/tmp/supervisord.sock
#chmod=not support
#chown=not support
username=test1
password=thepassword
#password={SHA}82ab876d1387bfafe46cc1c8a2ef074eae50cb1d

[inet_http_server]
port=0.0.0.0:5009
username=test1
password=thepassword


[supervisorctl]
serverurl = http://127.0.0.1:5009
# serverurl = unix:///tmp/supervisord.sock
username=test1
password=thepassword
#prompt = not support

; the below section must remain in the config file for RPC
; (supervisorctl/web interface) to work, additional interfaces may be
; added by defining them in separate rpcinterface: sections
[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
logfile=%(here)s/work/log/supervisord.log
logfileMaxbytes=5MB
logfileBackups=20
loglevel=info
pidfile=%(here)s/work/pid/supervisord.pid
#umask=not support
#nodaemon=not support
#minfds=not support
#minprocs=not support
#nocleanup=not support
#childlogdir=not support
#user=not support
#directory=not support
#strip_ansi=not support
#environment=not support
identifier=supervisor



